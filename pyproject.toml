[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seednoise"
version = "0.1.0"
description = "Measurement-error-free estimation of the nonshared-environmental correlation matrix R_E in a population of language models"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
gpu = ["torch>=2.0", "transformers>=4.40", "datasets>=2.18"]
hub = ["huggingface_hub>=0.23", "pyarrow>=14.0"]
dev = ["pytest>=7.0"]

[project.scripts]
seednoise = "seednoise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
